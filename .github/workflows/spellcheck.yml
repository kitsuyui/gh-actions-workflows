name: Reusable spellcheck

on:
  workflow_call:
    inputs:
      files:
        description: Path or glob passed to typos.
        required: false
        type: string
        default: "."
      config:
        description: Optional typos config path in the caller repository.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check spelling
        uses: crate-ci/typos@26e1ab0f398ee2139416a695ba2f7497533e6909 # master
        with:
          files: ${{ inputs.files }}
          config: ${{ inputs.config }}

name: Reusable gitignore-in update

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gitignore-in-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-gitignore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: gitignore-in/gh-action@497638056b4abf3bc97f007e091b451633904f2f # v0.2.4
